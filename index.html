<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset=""UTF-8/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>index.html</title>
        <link rel="icon" href="startup_favicon.jpg" />
        <link rel="stylesheet" href="main.css" />
        <link rel="stylesheet" href="login.css" />
    </head>
    <body>
        <header>
            <h1 class="heading" id="main-header">Concept Threads</h1>
            <hr />
        </header>
        <main id="login">
            <div class="login-box">
            <h1 class="heading">Login</h1>
            <form method="get" action="create.html">
                <div class="user-box">
                    <input type="text" name="email" required />
                    <label>Email</label>
                </div>
                <div class="user-box">
                    <input type="password" name="password" required />
                    <label>Password</label>
                </div>
                <div class="buttons">
                    <button type="submit">Login to Existing Account</button>
                    <button type="submit">Create New Account</button>
                </div>
            </form>
            </div>
        </main>
        <footer class="login-footer">
            <div>Kendyl Hansen</div>
            <a href="https://github.com/krhansen2016/startup">My GitHub Repo</a>
        </footer>
    </body>
</html>
